name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same branch supersedes an in-flight run.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The full range pyproject.toml claims to support, so the claim stays honest.
        # On 3.9 pip resolves click 8.1.x; newer click needs 3.10+.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pyflakes

      # The suite stubs the SDK and uses an in-memory keyring, so it needs no
      # credentials and makes no network calls. It therefore also needs no OS
      # keyring, which a CI runner does not have — see "Keyring support by
      # platform" in the README.
      - name: Tests
        run: pytest -q

      - name: Lint
        run: pyflakes sccfm_msp tests

  # Proves the install path the README tells people to use, from a clean checkout.
  install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install and run the CLI
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          sccfm-msp --version
          sccfm-msp --help
